name: Consumer UX validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'docs/AUTONOMOUS-UX-AGENT-RUN.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/consumer-ux-validation.yml'

jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build and prerender
        run: npm run build
      - name: Inspect output
        run: |
          test -f dist/index.html
          test -f dist/pto/index.html
          test -f dist/glossary/index.html
          test -f dist/llms.txt
          grep -q 'Your PTO, explained simply' dist/glossary/index.html
