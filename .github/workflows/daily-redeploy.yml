# Phase 2 (staleness): every page's date-relative content (the countdown, "N days away",
# sabbatical placements) is computed once at build time by scripts/prerender.ts and stamped
# with that build's own timestamp (see src/ui/prerenderedAt.ts) - it goes stale by exactly
# how long it's been since the last deploy. This triggers a fresh Vercel deploy daily so
# that drift never exceeds ~24 hours, without needing a real backend or a cron server.
#
# Needs a repository secret named VERCEL_DEPLOY_HOOK_URL (Project Settings -> Git -> Deploy
# Hooks in the Vercel dashboard - create one for the `main` branch, then paste its URL here
# as a GitHub Actions secret). See PROGRESS.md's "Questions for Atiyk".
name: Daily redeploy

on:
  schedule:
    - cron: '17 6 * * *' # once a day; the exact minute is arbitrary, chosen off the hour
  workflow_dispatch: {}

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        # The hook URL is a credential: pass it through the environment, never interpolate
        # it into the script text.
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            # Not a failure (no red X on main), but it must not look like a deploy happened:
            # this run used to report plain success while deploying nothing for days.
            msg="No deploy triggered: the VERCEL_DEPLOY_HOOK_URL secret is not set. Production is NOT being refreshed. See docs/growth/LAUNCH-READINESS.md."
            echo "::warning title=Daily redeploy skipped::$msg"
            echo "### Daily redeploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Deploy hook accepted. This only queues a build: check the Vercel dashboard (or the deployment status on the main commit) to confirm production actually updated." >> "$GITHUB_STEP_SUMMARY"
