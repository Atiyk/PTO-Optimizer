name: Consumer quick forecast QA

on:
  pull_request:
    paths:
      - 'src/ui/QuickForecast.tsx'
      - 'src/ui/forecastPresets.ts'
      - 'src/ui/QuickForecast.test.tsx'
      - 'scripts/consumer-quick-forecast-qa.mjs'
      - '.github/workflows/consumer-quick-forecast-qa.yml'

permissions:
  contents: read

jobs:
  forecast-browser:
    name: Forecast 1440/768/375/320 browser evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: |
          npm --ignore-scripts run build
          npm run postbuild
      - run: npx playwright install --with-deps chromium
      - name: Run responsive forecast interactions and screenshots
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/forecast-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          let ready = false;
          for (let attempt = 0; attempt < 30; attempt += 1) {
            try {
              if ((await fetch('http://127.0.0.1:4173/policy/')).ok) { ready = true; break; }
            } catch { /* preview is starting */ }
            await new Promise((resolve) => setTimeout(resolve, 1000));
          }
          if (!ready) throw new Error('Policy preview did not start');
          NODE
          node scripts/consumer-quick-forecast-qa.mjs http://127.0.0.1:4173 "$GITHUB_WORKSPACE/qa-evidence/quick-forecast"
      - name: Preserve forecast evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consumer-quick-forecast-evidence
          path: qa-evidence/quick-forecast
          if-no-files-found: warn
          retention-days: 14
