name: Consumer quick forecast QA

on:
  pull_request:
    paths:
      - 'src/ui/QuickForecast.tsx'
      - 'src/ui/forecastPresets.ts'
      - 'src/ui/QuickForecast.test.tsx'
      - 'scripts/consumer-quick-forecast-qa.mjs'
      - '.github/workflows/consumer-quick-forecast-qa.yml'

permissions:
  contents: read

jobs:
  forecast-browser:
    name: Forecast before/after 1440/768/375/320
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: current
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: current/package-lock.json
      - name: Install candidate
        working-directory: current
        run: npm ci
      - name: Install baseline
        working-directory: baseline
        run: npm ci
      - name: Build candidate
        working-directory: current
        run: |
          npm --ignore-scripts run build
          npm run postbuild
      - name: Build baseline
        working-directory: baseline
        run: |
          npm --ignore-scripts run build
          npm run postbuild
      - name: Install Chromium
        working-directory: current
        run: npx playwright install --with-deps chromium
      - name: Run before/after responsive forecast interactions and screenshots
        run: |
          npm --prefix current run preview -- --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/forecast-current.log" 2>&1 &
          current_pid=$!
          npm --prefix baseline run preview -- --host 127.0.0.1 --port 4174 --strictPort > "$RUNNER_TEMP/forecast-baseline.log" 2>&1 &
          baseline_pid=$!
          trap 'kill "$current_pid" "$baseline_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          for (const port of [4173, 4174]) {
            let ready = false;
            for (let attempt = 0; attempt < 30; attempt += 1) {
              try {
                if ((await fetch(`http://127.0.0.1:${port}/policy/`)).ok) { ready = true; break; }
              } catch { /* preview is starting */ }
              await new Promise((resolve) => setTimeout(resolve, 1000));
            }
            if (!ready) throw new Error(`Policy preview on ${port} did not start`);
          }
          NODE
          node current/scripts/consumer-quick-forecast-qa.mjs http://127.0.0.1:4174 "$GITHUB_WORKSPACE/qa-evidence/quick-forecast" before
          node current/scripts/consumer-quick-forecast-qa.mjs http://127.0.0.1:4173 "$GITHUB_WORKSPACE/qa-evidence/quick-forecast" after
      - name: Preserve forecast evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consumer-quick-forecast-evidence
          path: qa-evidence/quick-forecast
          if-no-files-found: warn
          retention-days: 14
