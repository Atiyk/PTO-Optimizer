    <!-- Migration (site restructure): the optimizer used to live at "/" - every link anyone
         has ever shared points here, carrying its state in the query string. The landing
         page defines no query parameters of its own (country is detected from locale, not a
         URL param), so ANY non-empty search string on "/" is, unambiguously, an old
         optimizer link. Redirect before the bundle loads - not after React mounts - so a
         visitor following a years-old link never sees the landing page flash first. A bare
         "/" (no search string) continues straight through to the landing page below.

         BUG FOUND testing this locally: without the pathname check, a server that serves
         THIS SAME landing-page HTML as a catch-all fallback for /pto (vite's own preview
         server does exactly this for a path with no trailing slash, and any misconfigured
         static host could too) would run this script again at /pto?..., see a non-empty
         search string, and `location.replace()` right back to the identical /pto URL -
         forcing a real reload, which serves the fallback again, which redirects again:
         an infinite reload loop, confirmed by watching the network tab repeat the same
         request 35,000+ times in well under a minute. Checking pathname === '/' makes the
         redirect fire only on the actual root, so it can never loop no matter how a
         misconfigured host resolves /pto - the production host (Vercel, cleanUrls: true)
         resolves /pto to its own distinct file as already proven by every existing country
         route using the identical pattern, but this script no longer depends on that being
         true to stay safe. -->
    <script>
      if (window.location.pathname === '/' && window.location.search) {
        window.location.replace('/pto' + window.location.search + window.location.hash);
      }
    </script>

    <!-- Cookieless analytics (Plausible) - no cookies, no cross-site identifiers, no

    <script defer data-domain="pto-optimizer.app" src="https://plausible.io/js/script.js"></script>
