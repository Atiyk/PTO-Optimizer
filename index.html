<!doctype html>
<html lang="en">
  <head>
    <meta name="referrer" content="no-referrer" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f0" />
    <link rel="preload" href="/fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin />

    <title>%PRODUCT_NAME% &mdash; Plan and Track Your Time Off</title>
    <meta
      name="description"
      content="Find longer breaks, customize employer holidays, track PTO requests, and forecast your balance. Plan your 2027 time off and any date range. Free, no sign-up."
    />
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%PRODUCT_NAME%" />
    <meta property="og:title" content="%PRODUCT_NAME% &mdash; Plan and Track Your Time Off" />
    <meta
      property="og:description"
      content="Find longer breaks, customize employer holidays, track PTO requests, and forecast your balance. Plan your 2027 time off and any date range. Free, no sign-up."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-images/landing.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%PRODUCT_NAME%: more days off from the same PTO." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%PRODUCT_NAME% &mdash; Plan and Track Your Time Off" />
    <meta
      name="twitter:description"
      content="Find longer breaks, customize employer holidays, track PTO requests, and forecast your balance. Plan your 2027 time off and any date range. Free, no sign-up."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-images/landing.png" />

    <!-- Historic optimizer links at the root keep their destination and exact query.
         New homepage previews use an explicit home=1 marker; no legacy param is renamed.
         The pathname guard prevents redirect loops on static-host fallback responses. -->
    <script>
      if (window.location.pathname === '/' && window.location.search &&
          new URLSearchParams(window.location.search).get('home') !== '1') {
        window.location.replace('/pto' + window.location.search + window.location.hash);
      }
    </script>

    <!-- Manual analytics: src/ui/PrivacyAnalytics.tsx supplies a query-free route
         and records one pageview per document. -->
    <script defer data-domain="%SITE_HOST%" src="https://plausible.io/js/script.manual.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing-main.tsx"></script>
  </body>
</html>
