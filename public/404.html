<!doctype html>
<html lang="en">
  <head>
    <meta name="referrer" content="no-referrer" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f4f4f0" />
    <title>Page not found &mdash; Gapless PTO Optimizer</title>
    <link rel="preload" href="/fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Archivo Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 400 800;
        font-stretch: 75% 100%;
        src: url('/fonts/archivo-latin-var.woff2') format('woff2-variations');
      }
      :root {
        --page: #f4f4f0;
        --surface: #ffffff;
        --ink: #141414;
        --muted: #56564f;
        --mark: #dcf763;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        background: var(--page);
        color: var(--ink);
        font: 16px/1.5 'Archivo Variable', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--mark);
        color: var(--ink);
      }
      main {
        box-sizing: border-box;
        width: 100%;
        max-width: 80rem;
        margin: 0 auto;
        padding: 3rem 1rem;
      }
      @media (min-width: 640px) {
        main {
          padding: 4rem 1.5rem;
        }
      }
      .code {
        margin: 0;
        font-size: clamp(6rem, 3rem + 16vw, 16rem);
        line-height: 0.8;
        font-weight: 800;
        font-stretch: 75%;
        letter-spacing: -0.03em;
      }
      .code span {
        background: var(--mark);
        padding: 0 0.06em;
      }
      h1 {
        margin: 2rem 0 0.75rem;
        font-size: clamp(2rem, 1.4rem + 2.4vw, 3rem);
        line-height: 1;
        font-weight: 800;
        font-stretch: 75%;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }
      p {
        max-width: 34rem;
        margin: 0 0 2rem;
        font-size: 1.125rem;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border: 1px solid var(--ink);
        border-radius: 3px;
        background: var(--surface);
        color: var(--ink);
        font-weight: 600;
        text-decoration: none;
        transition: background-color 150ms cubic-bezier(0.23, 1, 0.32, 1), color 150ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      a:hover {
        background: var(--mark);
      }
      a.primary {
        background: var(--ink);
        color: #fff;
      }
      a.primary:hover {
        background: var(--mark);
        color: var(--ink);
      }
      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true"><span>404</span></p>
      <h1>Page not found</h1>
      <p>That link may be truncated or out of date. Find your way back to Gapless PTO Optimizer.</p>
      <div class="links">
        <a class="primary" href="/">Gapless PTO Optimizer</a>
        <a href="/pto">Plan PTO</a>
        <a href="/sabbatical">Sabbatical</a>
      </div>
    </main>
  </body>
</html>
