    <style>
      @font-face {
        font-family: 'Archivo Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 400 800;
        font-stretch: 75% 100%;
        src: url('/fonts/archivo-latin-var.woff2') format('woff2-variations');
      }
      /* Arial adjusted to Archivo's metrics, as in src/index.css, so the swap barely moves. */
      @font-face {
        font-family: 'Archivo Fallback';
        src: local('Arial'), local('Liberation Sans'), local('Helvetica Neue'), local('Helvetica');
        size-adjust: 102%;
        ascent-override: 86%;
        descent-override: 21%;
        line-gap-override: 0%;
      }
      :root {
        --font: 'Archivo Variable', 'Archivo Fallback', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --page: #f5f6f8;
        --surface: #ffffff;
        --ink: #12141c;
        --muted: #535968;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.5;
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        box-sizing: border-box;
        width: 100%;
        max-width: 80rem;
        margin: 0 auto;
        padding: 0 1rem;
      }
      @media (min-width: 640px) {
        .wrap {
          padding: 0 1.5rem;
        }
      }
      header {
        border-bottom: 1px solid #dde0e6;
      }
      header .wrap {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem 1.5rem;
        min-height: 4rem;
      }
      header a {
        border: 0;
        background: transparent;
        padding: 0 0.25rem;
      }
      header a:hover {
        background: transparent;
        text-decoration: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: 0.22em;
      }
      .home {
        gap: 0.625rem;
        margin-left: -0.25rem;
      }
      .home span {
        font-size: 23px;
        font-weight: 800;
        font-stretch: 75%;
        letter-spacing: -0.01em;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0 1rem;
      }
      nav a {
        font-weight: 500;
        color: #535968;
      }
      main.wrap {
        padding-top: 4rem;
        padding-bottom: 6rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2.75rem, 1.6rem + 4.6vw, 5.5rem);
        line-height: 1;
        font-weight: 800;
        font-stretch: 75%;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }
      p {
        max-width: 34rem;
        margin: 0 0 2rem;
        font-size: 1.125rem;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0 1.25rem;
        border: 1px solid var(--ink);
        border-radius: 3px;
        background: var(--surface);
        color: var(--ink);
        font-weight: 600;
        text-decoration: none;
        transition: background-color 150ms cubic-bezier(0.23, 1, 0.32, 1), color 150ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      a:hover {
        background: #eceef2;
      }
      a.primary {
        background: var(--ink);
        color: #fff;
      }
      a.primary:hover {
        background: #2c28ad;
      }
      a:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
